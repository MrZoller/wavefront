<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="Wavefront">
  <title>Wavefront</title>
  <!--
    The mark: concentric wave crests radiating from a source — a wavefront propagating, the
    product's namesake. Signal-green accent (#3ef0a0) on transparent; no other palette. Single
    source of truth for the glyph: the app wordmark and the generated favicons both derive from this.
  -->
  <g stroke="#3ef0a0" stroke-width="2.4" stroke-linecap="round">
    <path d="M10.18 10.91 A6 6 0 0 1 10.18 21.09" />
    <path d="M13.09 6.25 A11.5 11.5 0 0 1 13.09 25.75" />
    <path d="M16.01 1.58 A17 17 0 0 1 16.01 30.42" />
  </g>
  <circle cx="7" cy="16" r="2.3" fill="#3ef0a0" />
</svg>
